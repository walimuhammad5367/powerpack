name: solana-check

# Baseline gate for the 1WIN Solana programs.
# Builds each program separately (the workspace root also contains host-only test
# crates, and `cargo build-sbf` at the root tries to compile those for SBF too,
# which fails inside getrandom), then runs the workspace tests.

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libudev-dev \
            libclang-dev clang protobuf-compiler

      - name: Rust (honours rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Solana CLI
        run: |
          curl -sSfL https://release.anza.xyz/stable/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          rustc --version && cargo --version && solana --version

      - name: Build programs (SBF, one manifest each)
        run: |
          mkdir -p target/deploy
          for p in sale burn vesting; do
            echo "::group::build $p"
            cargo build-sbf --manifest-path "programs/$p/Cargo.toml" --sbf-out-dir target/deploy
            echo "::endgroup::"
          done
          ls -la target/deploy

      - name: Workspace tests
        run: cargo test --workspace -- --nocapture

      - name: Upload program artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-so
          path: |
            target/deploy/*.so
            target/deploy/*-keypair.json
          if-no-files-found: warn
